name: SDK tests

on:
  # Testing against fix/cross-platform only for now - switch to [main] once trusted.
  push:
    branches: [fix/cross-platform]
  pull_request:
    branches: [fix/cross-platform]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 = the floor this package claims to support; 3.14 = newest stable.
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --extra dev

      - run: uv run pytest tests/ -v
