name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      bump_type:
        description: "Version bump. 'none' means you already bumped pyproject.toml by hand."
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    env:
      UV_PYTHON: "3.12"
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - name: bump version
        if: github.event.inputs.target == 'pypi' && github.event.inputs.bump_type != 'none'
        run: uvx hatch version ${{ github.event.inputs.bump_type }}

      - name: commit version bump
        if: github.event.inputs.target == 'pypi' && github.event.inputs.bump_type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "bumped version to $(uvx hatch version)"
          git push origin HEAD:${{ github.ref_name }}

      - run: uv sync --extra dev

      - name: run tests
        run: uv run pytest tests/ -v

      - name: read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: fail fast if this version was already published
        # PyPI would reject a re-upload anyway, but this catches a forgotten version bump immediately instead of after building.
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists — bump the version in pyproject.toml before publishing."
            exit 1
          fi

      - run: uv build

      - run: uv run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: tag the published commit
        if: github.event.inputs.target == 'pypi'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"

      - name: create GitHub release
        if: github.event.inputs.target == 'pypi'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ needs.build.outputs.version }}" dist/* --title "v${{ needs.build.outputs.version }}" --generate-notes
